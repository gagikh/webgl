<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL Image Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Segoe UI, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: #f5f5f5;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .panel {
        width: min(1100px, 100%);
        background: rgba(20, 20, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 16px 18px;
        align-items: end;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.03);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 120px;
      }

      label {
        font-size: 0.8rem;
        color: #bbb;
      }

      input[type="number"], input[type="file"], select, button {
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 9px 11px;
        font-size: 0.95rem;
        background: #1d1d1d;
        color: #fff;
      }

      button {
        cursor: pointer;
        background: linear-gradient(135deg, #2d7cf6, #0f4db8);
        border: none;
      }

      button:hover {
        filter: brightness(1.06);
      }

      .canvas-wrap {
        padding: 16px;
        display: flex;
        justify-content: center;
      }

      canvas {
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        background: #000;
        display: block;
      }

      .hint {
        color: #9fb3c8;
        font-size: 0.92rem;
        padding: 0 18px 18px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="controls">
        <div class="field">
          <label for="imageInput">Upload image</label>
          <input id="imageInput" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label for="widthInput">Capture width</label>
          <input id="widthInput" type="number" min="1" value="1920" />
        </div>
        <div class="field">
          <label for="heightInput">Capture height</label>
          <input id="heightInput" type="number" min="1" value="1080" />
        </div>
        <div class="field">
          <label for="aspectInput">Logo aspect</label>
          <select id="aspectInput">
            <option value="free" selected>Native</option>
            <option value="16:9">16:9</option>
            <option value="4:3">4:3</option>
            <option value="1:1">1:1</option>
            <option value="9:16">9:16</option>
            <option value="21:9">21:9</option>
            <option value="3:1">3:1</option>
          </select>
        </div>
        <div class="field">
          <label for="zoomInput">Zoom</label>
          <input id="zoomInput" type="range" min="0.2" max="20" step="0.01" value="1" />
        </div>
        <div class="field">
          <label for="camDistInput">Cam dist</label>
          <input id="camDistInput" type="range" min="0.3" max="10" step="0.05" value="3.8" />
        </div>
        <div class="field">
          <label for="perspectiveInput">Perspective</label>
          <input id="perspectiveInput" type="range" min="0.1" max="2.0" step="0.01" value="1.0" />
        </div>
        <button id="applyButton" type="button">Apply size</button>
        <button id="resetButton" type="button">Reset view</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="glCanvas"></canvas>
      </div>
      <div class="hint">Use the mouse primarily: drag to rotate, scroll to zoom, and hold Shift while scrolling for perspective. Sliders are there as a backup.</div>
    </div>

    <script>
      const canvas = document.getElementById('glCanvas');
      const widthInput = document.getElementById('widthInput');
      const heightInput = document.getElementById('heightInput');
      const zoomInput = document.getElementById('zoomInput');
      const camDistInput = document.getElementById('camDistInput');
      const perspectiveInput = document.getElementById('perspectiveInput');
      const imageInput = document.getElementById('imageInput');
      const aspectInput = document.getElementById('aspectInput');
      const applyButton = document.getElementById('applyButton');
      const resetButton = document.getElementById('resetButton');

      const gl = canvas.getContext('webgl');
      if (!gl) {
        document.body.innerHTML = '<div style="color:white; font-family:sans-serif; padding:24px;">WebGL is not available in this browser.</div>';
      } else {
        const vertexShaderSource = `
          attribute vec3 aPosition;
          attribute vec2 aTexCoord;
          attribute float aDepth;
          varying vec2 vTexCoord;
          varying float vDepth;
          void main() {
            vTexCoord = aTexCoord;
            vDepth = aDepth;
            gl_Position = vec4(aPosition.xy, 0.0, 1.0);
          }
        `;

        const fragmentShaderSource = `
          precision mediump float;
          varying vec2 vTexCoord;
          varying float vDepth;
          uniform sampler2D uSampler;
          uniform vec2 uResolution;
          void main() {
            float depthFactor = clamp(1.0 - vDepth * 0.45, 0.0, 1.0);
            vec2 texel = 1.0 / uResolution;
            vec4 color = texture2D(uSampler, vTexCoord);
            vec4 sum = vec4(0.0);
            float weightTotal = 0.0;
            float radius = depthFactor * 3.0;
            for (int i = -3; i <= 3; i++) {
              for (int j = -3; j <= 3; j++) {
                float weight = exp(-float(i * i + j * j) / 12.0);
                vec2 offset = vec2(float(i) * radius * texel.x, float(j) * radius * texel.y);
                sum += texture2D(uSampler, vTexCoord + offset) * weight;
                weightTotal += weight;
              }
            }
            vec4 blurred = sum / weightTotal;
            gl_FragColor = mix(color, blurred, depthFactor * 0.75);
          }
        `;

        function createShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
          }
          return shader;
        }

        function createProgram(vertexSource, fragmentSource) {
          const vertexShader = createShader(gl.VERTEX_SHADER, vertexSource);
          const fragmentShader = createShader(gl.FRAGMENT_SHADER, fragmentSource);
          if (!vertexShader || !fragmentShader) return null;

          const program = gl.createProgram();
          gl.attachShader(program, vertexShader);
          gl.attachShader(program, fragmentShader);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(gl.getProgramInfoLog(program));
            gl.deleteProgram(program);
            return null;
          }
          return program;
        }

        const program = createProgram(vertexShaderSource, fragmentShaderSource);
        if (!program) {
          throw new Error('Unable to initialize WebGL program.');
        }

        const positionLocation = gl.getAttribLocation(program, 'aPosition');
        const texCoordLocation = gl.getAttribLocation(program, 'aTexCoord');
        const depthLocation = gl.getAttribLocation(program, 'aDepth');
        const samplerLocation = gl.getUniformLocation(program, 'uSampler');
        const resolutionLocation = gl.getUniformLocation(program, 'uResolution');

        const gridSize = 16;
        const vertexData = [];
        const indices = [];
        for (let iy = 0; iy < gridSize; iy++) {
          for (let ix = 0; ix < gridSize; ix++) {
            const u = ix / (gridSize - 1);
            const v = iy / (gridSize - 1);
            const x = (u * 2.0 - 1.0) * 0.9;
            const y = (v * 2.0 - 1.0) * 0.7;
            const z = -0.06 * (x * x + y * y);
            vertexData.push(x, y, z, u, v, 0.0);
          }
        }

        for (let iy = 0; iy < gridSize - 1; iy++) {
          for (let ix = 0; ix < gridSize - 1; ix++) {
            const a = iy * gridSize + ix;
            const b = a + 1;
            const c = a + gridSize;
            const d = c + 1;
            indices.push(a, b, c, b, d, c);
          }
        }

        const vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertexData), gl.STATIC_DRAW);

        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

        let texture = null;
        let imageLoaded = false;
        let imageWidth = 1;
        let imageHeight = 1;
        let angleX = 0.0;
        let angleY = 0.0;
        let zoom = 1.0;
        let camDist = 3.8;
        let perspective = 1.0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let startAngleX = 0.0;
        let startAngleY = 0.0;

        function setCaptureSize(width, height) {
          width = Math.max(1, Math.floor(width || 1920));
          height = Math.max(1, Math.floor(height || 1080));
          canvas.width = width;
          canvas.height = height;
          gl.viewport(0, 0, width, height);
          canvas.style.width = '100%';
          canvas.style.maxWidth = `${Math.min(width, 1100)}px`;
          canvas.style.aspectRatio = `${width} / ${height}`;
        }

        function rotatePoint(x, y, z) {
          const cosY = Math.cos(angleY);
          const sinY = Math.sin(angleY);
          const cosX = Math.cos(angleX);
          const sinX = Math.sin(angleX);

          const x1 = x * cosY + z * sinY;
          const z1 = -x * sinY + z * cosY;
          const y1 = y;
          const y2 = y1 * cosX - z1 * sinX;
          const z2 = y1 * sinX + z1 * cosX;

          const depth = Math.max(0.05, camDist + z2 * perspective * 2.5);
          const scale = 0.46 * zoom * camDist / depth;
          const aspect = canvas.width / canvas.height;
          const displayAspect = getDisplayAspect();
          return {
            x: x1 * scale / aspect * displayAspect,
            y: y2 * scale,
            depth: 1.0 - z2 * 0.18
          };
        }

        function updateVertexBuffer() {
          const updated = [];
          const widthScale = imageWidth / imageHeight;
          for (let iy = 0; iy < gridSize; iy++) {
            for (let ix = 0; ix < gridSize; ix++) {
              const u = ix / (gridSize - 1);
              const v = iy / (gridSize - 1);
              const x = (u * 2.0 - 1.0) * 0.9 * widthScale;
              const y = (v * 2.0 - 1.0) * 0.7;
              const z = -0.06 * (x * x + y * y);
              const p = rotatePoint(x, y, z);
              updated.push(p.x, p.y, 0.0, u, 1.0 - v, p.depth);
            }
          }
          gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(updated), gl.STATIC_DRAW);
        }

        function createTextureFromImage(img) {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.bindTexture(gl.TEXTURE_2D, null);
          return tex;
        }

        function render() {
          if (!imageLoaded) {
            gl.clearColor(0.05, 0.05, 0.05, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            return;
          }

          updateVertexBuffer();
          gl.clearColor(0.03, 0.03, 0.03, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          gl.useProgram(program);

          gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
          gl.enableVertexAttribArray(positionLocation);
          gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 24, 0);
          gl.enableVertexAttribArray(texCoordLocation);
          gl.vertexAttribPointer(texCoordLocation, 2, gl.FLOAT, false, 24, 12);
          gl.enableVertexAttribArray(depthLocation);
          gl.vertexAttribPointer(depthLocation, 1, gl.FLOAT, false, 24, 20);

          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.uniform1i(samplerLocation, 0);
          gl.uniform2f(resolutionLocation, canvas.width, canvas.height);

          gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
        }

        canvas.addEventListener('mousedown', (event) => {
          isDragging = true;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          startAngleX = angleX;
          startAngleY = angleY;
          canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (event) => {
          if (!isDragging) return;
          angleX = startAngleX + (event.clientY - dragStartY) * 0.008;
          angleY = startAngleY + (event.clientX - dragStartX) * 0.008;
          render();
        });

        window.addEventListener('mouseup', () => {
          isDragging = false;
          canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('wheel', (event) => {
          event.preventDefault();
          if (event.shiftKey) {
            perspective = Math.max(0.2, Math.min(1.2, perspective + (event.deltaY > 0 ? -0.03 : 0.03)));
            perspectiveInput.value = perspective;
          } else {
            const direction = event.deltaY > 0 ? 0.94 : 1.06;
            zoom = Math.max(0.2, Math.min(20, zoom * direction));
            zoomInput.value = zoom;
          }
          render();
        }, { passive: false });

        zoomInput.addEventListener('input', (event) => {
          zoom = Number(event.target.value);
          render();
        });

        camDistInput.addEventListener('input', (event) => {
          camDist = Number(event.target.value);
          render();
        });

        perspectiveInput.addEventListener('input', (event) => {
          perspective = Number(event.target.value);
          render();
        });

        imageInput.addEventListener('change', (event) => {
          const file = event.target.files[0];
          if (!file) return;

          const img = new Image();
          img.onload = () => {
            imageWidth = img.naturalWidth || img.width;
            imageHeight = img.naturalHeight || img.height;
            texture = createTextureFromImage(img);
            imageLoaded = true;
            render();
          };
          img.onerror = () => {
            console.error('Unable to load image.');
          };
          img.src = URL.createObjectURL(file);
        });

        function getDisplayAspect() {
          const val = aspectInput.value;
          if (val === 'free') return imageWidth / imageHeight;
          const [w, h] = val.split(':').map(Number);
          return w / h;
        }

        aspectInput.addEventListener('change', () => render());

        applyButton.addEventListener('click', () => {
          setCaptureSize(Number(widthInput.value), Number(heightInput.value));
          render();
        });

        resetButton.addEventListener('click', () => {
          zoom = 1.0;
          camDist = 3.8;
          perspective = 1.0;
          angleX = 0.0;
          angleY = 0.0;
          zoomInput.value = zoom;
          camDistInput.value = camDist;
          perspectiveInput.value = perspective;
          render();
        });

        canvas.style.cursor = 'grab';
        setCaptureSize(Number(widthInput.value), Number(heightInput.value));
        render();
      }
    </script>
  </body>
</html>
